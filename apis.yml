name: Pluto Brand
description: >-
  Pluto (Plutopillow) is a Los Angeles-based direct-to-consumer sleep wellness
  brand best known for the Pluto Pillow, a made-to-order pillow custom-built
  around each customer's unique sleep profile via an online sleep quiz. The
  company also sells the PUFF body pillow, the POD travel pillow, and
  temperature-regulating bedding, and offers a 125-night risk-free trial with
  free shipping and returns. Surfaced as a portfolio company of 500 Global and
  added to the API Evangelist network, Pluto is a consumer e-commerce brand with
  no public developer platform, API, SDKs, or partner-integration surface at this
  time; this profile captures its public web properties for discovery.
